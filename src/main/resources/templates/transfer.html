<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Transfer Money - Banking Application</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <h1>Transfer Money</h1>
</header>

<nav>
    <ul>
        <li><a th:href="@{/management/info}">Info</a></li>
        <li><a th:href="@{/management/userAccount/{id}(id=${user.username})}" sec:authorize="hasRole('ROLE_USER')">Account</a></li>
        <li><a th:href="@{/transfer}" sec:authorize="hasRole('ROLE_USER')">Transfer</a></li>
        <li><a th:href="@{/transactions}" sec:authorize="hasRole('ROLE_USER')">Transactions</a></li>
        <li><a th:href="@{/management/getAll}" sec:authorize="hasAnyRole('ROLE_MODERATOR','ROLE_ADMIN')">User management</a></li>
        <li>
            <form th:action="@{/perform-logout}" method="post">
                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
                <button type="submit" class="btn btn-secondary">Logout</button>
            </form>
        </li>
    </ul>
</nav>

<div class="container">
    <div class="card">
        <h2>Transfer Money</h2>

        <div class="account-info">
            <p><strong>Your Account:</strong> <span th:text="${sourceAccount.accountNumber}"></span></p>
            <p><strong>Current Balance:</strong> <span th:text="${sourceAccount.balance + ' PLN'}" th:class="${sourceAccount.balance >= 0 ? 'balance-positive' : 'balance-negative'}"></span></p>
        </div>

        <form th:action="@{/transfer}" method="post">
            <div class="form-group">
                <label for="targetPesel">Recipient PESEL:</label>
                <input type="text" id="targetPesel" name="targetPesel" required>
            </div>

            <div class="form-group">
                <label for="amount">Amount (PLN):</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" required>
            </div>

            <button type="submit" class="btn">Transfer</button>
            <a th:href="@{/management/userAccount/{id}(id=${user.username})}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2025 Bank Application. All rights reserved.</p>
</footer>
</body>
</html>
