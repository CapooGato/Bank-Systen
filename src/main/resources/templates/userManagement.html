<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta charset="UTF-8">
  <title>Account Details - Banking Application</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
  <h1>Your Bank Account</h1>
</header>

<nav>
  <ul>
    <li><a th:href="@{/management/info}">Info</a></li>
    <li><a th:href="@{/management/userAccount/{id}(id=${user.username})}" sec:authorize="hasRole('ROLE_USER')">Account</a></li>
    <li><a th:href="@{/transfer}" sec:authorize="hasRole('ROLE_USER')">Transfer</a></li>
    <li><a th:href="@{/transactions}" sec:authorize="hasRole('ROLE_USER')">Transactions</a></li>
    <li><a th:href="@{/management/getAll}" sec:authorize="hasAnyRole('ROLE_MODERATOR','ROLE_ADMIN')">User management</a></li>
    <li>
      <form th:action="@{/perform-logout}" method="post">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
        <button type="submit" class="btn btn-secondary">Logout</button>
      </form>
    </li>
  </ul>
</nav>

<div class="container">
  <table th:if="${not #lists.isEmpty(users)}">
    <thead>
    <tr>
      <th>Name</th>
      <th>Role</th>
      <th>Operation</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="us : ${users}">
      <td th:text="${us.getFirstName() + ' ' + us.getLastName()}"></td>
      <td th:text="${#strings.arrayJoin(user.roles, ', ')}"></td>
      <td>
        <form th:action="@{/management/deleteUser/{id}(id=${us.getId()})}" method="post"
              onsubmit="return confirm('Are you sure you want to delete the user?');">
          <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
          <button type="submit" class="btn btn-danger">Delete</button>
        </form>

        <div th:if="${#lists.contains(user.roles, 'ROLE_ADMIN')}">
          <div th:each="role : ${availableRoles}">
            <form th:action="@{/management/toggleRole}" method="post">
              <input type="hidden" name="userId" th:value="${us.getId()}" />
              <input type="hidden" name="role" th:value="${role}" />
              <input type="hidden" name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="submit"
                      th:text="${#strings.substring(role, 5)}"
                      th:class="${#lists.contains(us.roles, role)} ? 'btn btn-success' : 'btn btn-outline-secondary'">
              </button>
            </form>
          </div>
        </div>
        <a th:href="@{/management/userAccount/{id}(id=${us.username})}" sec:authorize="hasRole('ROLE_ADMIN')" class="btn btn-info">View Account</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<footer>
  <p>&copy; 2025 Bank Application. All rights reserved.</p>
</footer>
</body>
</html>
